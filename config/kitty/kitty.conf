# font_family FantasqueSansM Nerd Font Mono
# bold_font FantasqueSansM Nerd Font Mono Bold
# italic_font FantasqueSansM Nerd Font Mono Italic
#font_features CascadiaCodePL-Italic +calt +ss01 +ss19
#font_features CascadiaCodePLItalic_700wght +calt +ss19
#font_features CascadiaCodePL-Regular +calt +ss19
font_size 13
disable_ligatures cursor
scrollback_lines 10000
enable_audio_bell no
cursor_shape block
shell_integration no-cursor
allow_remote_control socket-only
listen_on unix:/tmp/kitty
repaint_delay 18
map ctrl+plus change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+pgdn next_tab
map ctrl+page_up previous_tab
map ctrl+t combine : new_tab : set_tab_title

shell /usr/bin/zsh
window_padding_width 6 10

# Colours and tab bar generated by DMS from the current theme; kept last so they win.
include dank-theme.conf
include dank-tabs.conf

# Softer than the theme's near-white foreground, which blooms on the dark background.
foreground #c1c2c4
# Below the default gamma of 1.0, light text on a dark background renders thinner.
text_composition_strategy 0.1 0


# BEGIN_KITTY_FONTS
font_family      family='FantasqueSansM Nerd Font Mono' postscript_name=FantasqueSansMNFM-Regular
bold_font        family='FantasqueSansM Nerd Font Mono' postscript_name=FantasqueSansMNFM-Bold
italic_font      family='FantasqueSansM Nerd Font Mono' postscript_name=FantasqueSansMNFM-Italic
bold_italic_font auto
# END_KITTY_FONTS