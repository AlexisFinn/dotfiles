source = /home/alexis/.cache/hypr-theme/colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = $wallpaper
    color = $background
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 96
    font_family = Cascadia Code PL
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = $color8
    inner_color = $background
    font_color = $foreground
    font_family = Cascadia Code PL
    check_color = $claude_label
    fail_color = $claude_action
    fade_on_empty = false
    rounding = 8
    position = 0, -40
    halign = center
    valign = center
}
